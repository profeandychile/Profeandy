<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6C63FF">

<title>AURA+</title>

<style>
/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #eef0f7;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7f8fc;
    color: #20202b;
    min-height: 100vh;
    padding-bottom: 88px;
}

/* En computador simulamos una app móvil */
.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    background: #f7f8fc;
    position: relative;
    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    background: linear-gradient(145deg, #6258e8, #8379ff);
    color: white;
    padding: 24px 20px 30px;
    border-radius: 0 0 30px 30px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-icon {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    background: rgba(255,255,255,.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.brand-name {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand-subtitle {
    font-size: 10px;
    opacity: .8;
}

.notification {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 13px;
    background: rgba(255,255,255,.16);
    color: white;
    font-size: 20px;
}

.welcome {
    margin-top: 25px;
}

.welcome h2 {
    font-size: 24px;
    margin-bottom: 4px;
}

.welcome p {
    font-size: 13px;
    opacity: .82;
}

/* =========================
   CONTENIDO
========================= */

.content {
    padding: 0 16px;
}

/* =========================
   TARJETA AURAS
========================= */

.aura-card {
    margin-top: -10px;
    background: linear-gradient(135deg, #fff7c7, #ffe57c);
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(40,40,80,.12);
    position: relative;
    overflow: hidden;
}

.aura-card::after {
    content: "✨";
    position: absolute;
    right: -10px;
    bottom: -20px;
    font-size: 95px;
    opacity: .15;
}

.aura-small {
    font-size: 12px;
    font-weight: 700;
    color: #685900;
}

.aura-number {
    font-size: 42px;
    font-weight: 900;
    color: #302900;
    margin-top: 4px;
}

.aura-label {
    font-size: 12px;
    color: #6d5f00;
}

/* =========================
   NFC
========================= */

.nfc-card {
    margin-top: 16px;
    background: #202033;
    color: white;
    border-radius: 22px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 20px rgba(20,20,40,.14);
}

.nfc-icon {
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,.10);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.nfc-text {
    flex: 1;
}

.nfc-text strong {
    display: block;
    font-size: 15px;
}

.nfc-text span {
    display: block;
    font-size: 11px;
    opacity: .65;
    margin-top: 3px;
}

.nfc-button {
    border: none;
    background: #7167ff;
    color: white;
    padding: 11px 13px;
    border-radius: 12px;
    font-weight: 700;
}

/* =========================
   SECCIONES
========================= */

.section {
    margin-top: 25px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.section-title {
    font-size: 18px;
    font-weight: 800;
}

.see-all {
    border: none;
    background: none;
    color: #675eea;
    font-size: 12px;
    font-weight: 700;
}

/* =========================
   ACCESOS
========================= */

.quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
}

.quick {
    background: white;
    border-radius: 20px;
    padding: 17px;
    min-height: 112px;
    border: none;
    text-align: left;
    box-shadow: 0 5px 16px rgba(30,30,70,.05);
    transition: transform .15s;
}

.quick:active {
    transform: scale(.97);
}

.quick-icon {
    font-size: 27px;
    margin-bottom: 11px;
}

.quick strong {
    display: block;
    font-size: 14px;
}

.quick span {
    display: block;
    font-size: 11px;
    color: #92929d;
    margin-top: 4px;
}

/* =========================
   PROGRESO
========================= */

.progress-card {
    background: white;
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 5px 16px rgba(30,30,70,.05);
}

.progress-row {
    margin-bottom: 16px;
}

.progress-row:last-child {
    margin-bottom: 0;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 7px;
}

.progress-info span:last-child {
    color: #7167ee;
    font-weight: 700;
}

.progress {
    width: 100%;
    height: 9px;
    background: #eeeeF5;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg,#655be8,#8c84ff);
}

/* =========================
   NAVEGACIÓN INFERIOR
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 75px;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(15px);
    border-top: 1px solid #eeeeF3;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
    border: none;
    background: none;
    color: #9999a5;
    font-size: 10px;
    font-weight: 600;
    width: 20%;
}

.nav-item div {
    font-size: 21px;
    margin-bottom: 4px;
}

.nav-item.active {
    color: #665de8;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(20,20,35,.50);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 300;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    background: #f7f8fc;
    border-radius: 28px 28px 0 0;
    padding: 22px 18px 35px;
    animation: subir .2s ease;
}

@keyframes subir {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.modal-header h2 {
    font-size: 20px;
}

.close {
    border: none;
    background: #e9e9f0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 15px;
}

/* =========================
   BOTONES
========================= */

.primary {
    width: 100%;
    border: none;
    background: #675de8;
    color: white;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14px;
}

.secondary {
    border: none;
    background: #eeeeff;
    color: #6259d8;
    padding: 10px 13px;
    border-radius: 11px;
    font-weight: 700;
}

.danger {
    border: none;
    background: #ffe7e7;
    color: #d33;
    padding: 10px 13px;
    border-radius: 11px;
}

/* =========================
   FORMULARIOS
========================= */

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 5px;
}

input,
select {
    width: 100%;
    border: 1px solid #dedee8;
    background: white;
    padding: 14px;
    border-radius: 13px;
    margin-bottom: 14px;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #6c63e8;
}

/* =========================
   ESTUDIANTES
========================= */

.student {
    background: white;
    border-radius: 19px;
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: 0 4px 12px rgba(30,30,70,.04);
}

.student-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 15px;
    background: #eeeeff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.student-main {
    flex: 1;
}

.student-name {
    font-size: 14px;
    font-weight: 800;
}

.student-info {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
}

.student-aura {
    background: #fff3ad;
    color: #665800;
    border-radius: 20px;
    padding: 7px 9px;
    font-size: 11px;
    font-weight: 800;
}

.actions {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

/* =========================
   RECOMPENSAS
========================= */

.reward {
    background: white;
    border-radius: 19px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 13px;
}

.reward-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    background: #f0efff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.reward-info {
    flex: 1;
}

.reward-name {
    font-weight: 800;
    font-size: 13px;
}

.reward-price {
    font-size: 11px;
    color: #6a60df;
    font-weight: 700;
    margin-top: 5px;
}

.reward button {
    border: none;
    background: #665de7;
    color: white;
    padding: 9px 11px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}

/* =========================
   HISTORIAL
========================= */

.transaction {
    background: white;
    border-radius: 17px;
    padding: 14px;
    margin-bottom: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.transaction-info strong {
    font-size: 13px;
}

.transaction-info small {
    color: #999;
    font-size: 10px;
}

.transaction-amount {
    font-size: 14px;
    font-weight: 800;
}

.plus {
    color: #159447;
}

.minus {
    color: #d33;
}

/* =========================
   VACÍO
========================= */

.empty {
    text-align: center;
    padding: 35px 20px;
    color: #999;
    font-size: 13px;
}

.empty-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 90%;
    background: #202033;
    color: white;
    padding: 12px 18px;
    border-radius: 13px;
    font-size: 12px;
    display: none;
    z-index: 500;
}

.toast.show {
    display: block;
}

/* =========================
   PC
========================= */

@media (min-width: 700px) {

    body {
        padding: 20px 0;
    }

    .app {
        min-height: calc(100vh - 40px);
        border-radius: 30px;
        box-shadow: 0 15px 50px rgba(20,20,50,.15);
    }

    .bottom-nav {
        bottom: 20px;
        border-radius: 0 0 30px 30px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-top">

        <div class="brand">

            <div class="brand-icon">
                ✨
            </div>

            <div>
                <div class="brand-name">
                    AURA+
                </div>

                <div class="brand-subtitle">
                    Aprende · Avanza · Consigue
                </div>
            </div>

        </div>

        <button class="notification">
            🔔
        </button>

    </div>

    <div class="welcome">

        <h2>Hola 👋</h2>

        <p>
            Hagamos que cada avance cuente.
        </p>

    </div>

</header>


<main class="content">

<!-- =========================
     AURAS
========================= -->

<section class="aura-card">

    <div class="aura-small">
        ✨ MIS AURAS
    </div>

    <div
        class="aura-number"
        id="totalAuras">
        0
    </div>

    <div class="aura-label">
        monedas disponibles
    </div>

</section>


<!-- =========================
     NFC
========================= -->

<section class="nfc-card">

    <div class="nfc-icon">
        🪪
    </div>

    <div class="nfc-text">

        <strong>
            Identificar estudiante
        </strong>

        <span>
            Tarjeta NFC preparada
        </span>

    </div>

    <button
        class="nfc-button"
        onclick="simularNFC()">

        ESCANEAR

    </button>

</section>


<!-- =========================
     ACCESOS
========================= -->

<section class="section">

    <div class="section-header">

        <div class="section-title">
            Accesos rápidos
        </div>

    </div>

    <div class="quick-grid">

        <button
            class="quick"
            onclick="abrirEstudiantes()">

            <div class="quick-icon">
                👥
            </div>

            <strong>
                Estudiantes
            </strong>

            <span id="cantidadEstudiantes">
                0 estudiantes
            </span>

        </button>


        <button
            class="quick"
            onclick="abrirAuras()">

            <div class="quick-icon">
                🪙
            </div>

            <strong>
                Auras
            </strong>

            <span>
                Ganar y gastar
            </span>

        </button>


        <button
            class="quick"
            onclick="abrirMisiones()">

            <div class="quick-icon">
                🎯
            </div>

            <strong>
                Misiones
            </strong>

            <span>
                Desafíos
            </span>

        </button>


        <button
            class="quick"
            onclick="abrirLogros()">

            <div class="quick-icon">
                🏆
            </div>

            <strong>
                Logros
            </strong>

            <span>
                Insignias
            </span>

        </button>


        <button
            class="quick"
            onclick="abrirTienda()">

            <div class="quick-icon">
                🎁
            </div>

            <strong>
                Recompensas
            </strong>

            <span>
                Canjear Auras
            </span>

        </button>


        <button
            class="quick"
            onclick="abrirHistorial()">

            <div class="quick-icon">
                📜
            </div>

            <strong>
                Historial
            </strong>

            <span>
                Movimientos
            </span>

        </button>

    </div>

</section>


<!-- =========================
     PROGRESO
========================= -->

<section class="section">

    <div class="section-header">

        <div class="section-title">
            📈 Progreso
        </div>

    </div>


    <div class="progress-card">

        <div class="progress-row">

            <div class="progress-info">
                <span>Actividades</span>
                <span>65%</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:65%">
                </div>
            </div>

        </div>


        <div class="progress-row">

            <div class="progress-info">
                <span>Misiones</span>
                <span>40%</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:40%">
                </div>
            </div>

        </div>


        <div class="progress-row">

            <div class="progress-info">
                <span>Logros</span>
                <span>30%</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:30%">
                </div>
            </div>

        </div>

    </div>

</section>

</main>


<!-- =========================
     NAVEGACIÓN
========================= -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        onclick="irInicio()">

        <div>🏠</div>
        Inicio

    </button>


    <button
        class="nav-item"
        onclick="abrirEstudiantes()">

        <div>👥</div>
        Estudiantes

    </button>


    <button
        class="nav-item"
        onclick="abrirAuras()">

        <div>✨</div>
        Auras

    </button>


    <button
        class="nav-item"
        onclick="abrirMisiones()">

        <div>🎯</div>
        Misiones

    </button>


    <button
        class="nav-item"
        onclick="abrirTienda()">

        <div>🎁</div>
        Premios

    </button>

</nav>

</div>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                AURA+
            </h2>

            <button
                class="close"
                onclick="cerrarModal()">
                ✕
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================================
   DATOS
========================================= */

let estudiantes = JSON.parse(
    localStorage.getItem("aura_estudiantes") || "[]"
);

let movimientos = JSON.parse(
    localStorage.getItem("aura_movimientos") || "[]"
);


let recompensas = [

    {
        id: 1,
        nombre: "Elegir una actividad",
        icono: "🎯",
        precio: 50
    },

    {
        id: 2,
        nombre: "10 minutos de juego",
        icono: "🎮",
        precio: 80
    },

    {
        id: 3,
        nombre: "Elegir una canción",
        icono: "🎵",
        precio: 60
    },

    {
        id: 4,
        nombre: "Ser ayudante del profesor",
        icono: "⭐",
        precio: 100
    },

    {
        id: 5,
        nombre: "Premio físico",
        icono: "🎁",
        precio: 200
    }

];


/* =========================================
   GUARDAR
========================================= */

function guardar() {

    localStorage.setItem(
        "aura_estudiantes",
        JSON.stringify(estudiantes)
    );

    localStorage.setItem(
        "aura_movimientos",
        JSON.stringify(movimientos)
    );

    actualizarInicio();

}


/* =========================================
   ACTUALIZAR INICIO
========================================= */

function actualizarInicio() {

    let total = estudiantes.reduce(
        (suma, estudiante) =>
        suma + Number(estudiante.auras || 0),
        0
    );

    document.getElementById(
        "totalAuras"
    ).textContent = total;


    document.getElementById(
        "cantidadEstudiantes"
    ).textContent =
        estudiantes.length +
        (
            estudiantes.length === 1
            ? " estudiante"
            : " estudiantes"
        );

}


/* =========================================
   MODAL
========================================= */

function abrirModal(titulo, contenido) {

    document.getElementById(
        "modalTitle"
    ).textContent = titulo;


    document.getElementById(
        "modalContent"
    ).innerHTML = contenido;


    document.getElementById(
        "modal"
    ).classList.add("active");

}


function cerrarModal() {

    document.getElementById(
        "modal"
    ).classList.remove("active");

}


/* =========================================
   TOAST
========================================= */

function mostrarToast(mensaje) {

    let toast =
        document.getElementById("toast");

    toast.textContent = mensaje;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


/* =========================================
   ESTUDIANTES
========================================= */

function abrirEstudiantes() {

    let html = `

        <button
            class="primary"
            onclick="formularioEstudiante()">

            + Agregar estudiante

        </button>

        <div style="height:15px"></div>

    `;


    if (estudiantes.length === 0) {

        html += `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                Todavía no tienes estudiantes registrados.

            </div>

        `;

    } else {

        estudiantes.forEach(
            (e,index) => {

                html += `

                    <div class="student">

                        <div class="student-top">

                            <div class="avatar">
                                👤
                            </div>

                            <div class="student-main">

                                <div class="student-name">
                                    ${e.nombre}
                                </div>

                                <div class="student-info">
                                    ${e.curso || "Sin curso"}
                                </div>

                            </div>

                            <div class="student-aura">
                                ✨ ${e.auras || 0}
                            </div>

                        </div>


                        <div class="actions">

                            <button
                                class="secondary"
                                onclick="darAuras(${index})">

                                + Auras

                            </button>


                            <button
                                class="secondary"
                                onclick="editarEstudiante(${index})">

                                ✏️

                            </button>


                            <button
                                class="danger"
                                onclick="eliminarEstudiante(${index})">

                                🗑️

                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }


    abrirModal(
        "👥 Estudiantes",
        html
    );

}


/* =========================================
   FORMULARIO
========================================= */

function formularioEstudiante(indice = null) {

    let estudiante =
        indice !== null
        ? estudiantes[indice]
        : {
            nombre:"",
            curso:"",
            nfc:"",
            auras:0
        };


    let titulo =
        indice === null
        ? "➕ Nuevo estudiante"
        : "✏️ Editar estudiante";


    let html = `

        <label>
            Nombre
        </label>

        <input
            id="nombre"
            value="${estudiante.nombre}"
            placeholder="Nombre del estudiante">


        <label>
            Curso
        </label>

        <input
            id="curso"
            value="${estudiante.curso}"
            placeholder="Ej: 6° Básico">


        <label>
            Código NFC
        </label>

        <input
            id="nfc"
            value="${estudiante.nfc}"
            placeholder="Ej: AURA-001">


        <button
            class="primary"
            onclick="guardarEstudiante(${indice})">

            💾 Guardar estudiante

        </button>

    `;


    abrirModal(
        titulo,
        html
    );

}


/* =========================================
   GUARDAR ESTUDIANTE
========================================= */

function guardarEstudiante(indice) {

    let nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    let curso =
        document.getElementById(
            "curso"
        ).value.trim();


    let nfc =
        document.getElementById(
            "nfc"
        ).value.trim();


    if (!nombre) {

        mostrarToast(
            "Escribe el nombre del estudiante."
        );

        return;
    }


    if (indice === null) {

        estudiantes.push({

            nombre: nombre,
            curso: curso,
            nfc: nfc,
            auras: 0

        });

    } else {

        estudiantes[indice].nombre = nombre;
        estudiantes[indice].curso = curso;
        estudiantes[indice].nfc = nfc;

    }


    guardar();

    abrirEstudiantes();

    mostrarToast(
        "Estudiante guardado ✨"
    );

}


/* =========================================
   EDITAR
========================================= */

function editarEstudiante(indice) {

    formularioEstudiante(indice);

}


/* =========================================
   ELIMINAR
========================================= */

function eliminarEstudiante(indice) {

    if (
        confirm(
            "¿Eliminar este estudiante?"
        )
    ) {

        estudiantes.splice(
            indice,
            1
        );

        guardar();

        abrirEstudiantes();

        mostrarToast(
            "Estudiante eliminado"
        );

    }

}


/* =========================================
   DAR AURAS
========================================= */

function darAuras(indice) {

    let cantidad =
        Number(
            prompt(
                "¿Cuántas Auras quieres entregar?"
            )
        );


    if (
        !cantidad ||
        cantidad <= 0
    ) return;


    estudiantes[indice].auras += cantidad;


    movimientos.unshift({

        estudiante:
            estudiantes[indice].nombre,

        cantidad:
            cantidad,

        tipo:
            "ganancia",

        motivo:
            "Recompensa manual",

        fecha:
            new Date().toLocaleString()

    });


    guardar();

    abrirEstudiantes();

    mostrarToast(
        `+${cantidad} Auras ✨`
    );

}

/* =========================================
   CANJEAR
========================================= */

function canjear(id) {

    if (
        estudiantes.length === 0
    ) {

        mostrarToast(
            "Primero agrega estudiantes."
        );

        return;
    }


    let recompensa =
        recompensas.find(
            r => r.id === id
        );


    let lista =
        estudiantes
        .map(
            (e,index) =>
            `${index + 1}. ${e.nombre}`
        )
        .join("\n");


    let seleccion =
        prompt(
            "Selecciona estudiante:\n\n" +
            lista +
            "\n\nEscribe el número:"
        );


    let indice =
        Number(seleccion) - 1;


    if (
        indice < 0 ||
        indice >= estudiantes.length
    ) return;


    let estudiante =
        estudiantes[indice];


    if (
        estudiante.auras <
        recompensa.precio
    ) {

        mostrarToast(
            "No tiene suficientes Auras."
        );

        return;
    }


    if (
        !confirm(
            `¿Canjear "${recompensa.nombre}" por ${recompensa.precio} Auras?`
        )
    ) return;


    estudiante.auras -=
        recompensa.precio;


    movimientos.unshift({

        estudiante:
            estudiante.nombre,

        cantidad:
            recompensa.precio,

        tipo:
            "gasto",

        motivo:
            "Canje: " +
            recompensa.nombre,

        fecha:
            new Date().toLocaleString()

    });


    guardar();

    mostrarToast(
        "🎉 Recompensa canjeada"
    );

    abrirTienda();

}
