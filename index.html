
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b50">
<title>LSCh A1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f6f8;color:#203541;font-family:Arial,sans-serif}
header{background:#123b50;color:white;padding:25px 20px;border-radius:0 0 25px 25px}
header h1{margin:8px 0;font-size:30px}
header p{margin:0;font-size:14px}
main{padding:16px;max-width:600px;margin:auto}
.card{background:white;padding:18px;border-radius:18px;margin-bottom:15px;box-shadow:0 3px 12px #123b5010}
h2{font-size:19px}
label{display:block;margin:12px 0 6px;font-size:14px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd9df;border-radius:10px;font-size:16px;background:white}
button{border:0;background:#13a99a;color:white;padding:13px;border-radius:11px;font-size:15px;font-weight:bold;cursor:pointer}
.full{width:100%;margin-top:14px}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
nav button{white-space:nowrap;font-size:13px;padding:12px}
.hidden{display:none}
.entry{padding:12px;margin-top:10px;background:#f1f8f7;border-radius:10px;border-left:4px solid #13a99a;overflow-wrap:anywhere}
small{color:#607783}
</style>
</head>
<body>
<header>
<small style="color:#bce9e4">COLEGIO AURORA DE CHILE · RANCAGUA</small>
<h1>🤟 LSCh A1</h1>
<p>Lengua de Señas Chilena: aprendizaje y seguimiento</p>
</header>
<main>
<div class="card">
<strong>¡Bienvenido a LSCh A1!</strong>
<p>Prototipo educativo de Profe Andy.</p>
<small>Utiliza estudiantes ficticios durante las pruebas.</small>
</div>
<nav>
<button onclick="tab('students')">Estudiantes</button>
<button onclick="tab('register')">Aprendizajes</button>
<button onclick="tab('history')">Historial</button>
<button onclick="backup()">Respaldo</button>
</nav>
<section id="students">
<div class="card">
<h2>👤 Crear perfil</h2>
<form id="sf">
<label>Nombre ficticio</label>
<input id="name" required maxlength="100" placeholder="Ej.: Estudiante de prueba">
<label>Curso</label>
<input id="course" required maxlength="40" placeholder="Ej.: 1° Básico">
<button class="full">Crear estudiante</button>
</form>
</div>
<div class="card">
<h2>Estudiantes registrados</h2>
<div id="studentsList"></div>
</div>
</section>
<section id="register" class="hidden">
<div class="card">
<h2>✍️ Registrar aprendizaje</h2>
<form id="rf">
<label>Estudiante</label><select id="who" required></select>
<label>Seña trabajada</label><input id="sign" required placeholder="Ej.: Hola, gracias">
<label>Resultado</label>
<select id="result">
<option>Lo realiza de forma autónoma</option>
<option>Lo realiza con apoyo</option>
<option>En proceso de aprendizaje</option>
<option>Requiere más práctica</option>
</select>
<label>Fecha de actividad</label><input type="date" id="date" required>
<label>Observación opcional</label><textarea id="obs" maxlength="1000"></textarea>
<button class="full">Guardar aprendizaje</button>
</form>
</div>
</section>
<section id="history" class="hidden">
<div class="card">
<h2>📚 Historial</h2>
<label>Estudiante</label><select id="hw"></select>
<div id="records"></div>
</div>
</section>
</main>
<script>
const KEY='lschA1Local';
let students=[],records=[];
function load(){
try{
let d=JSON.parse(localStorage.getItem(KEY)||'{}');
students=Array.isArray(d.students)?d.students:[];
records=Array.isArray(d.records)?d.records:[];
}catch(e){students=[];records=[]}
}
function save(){localStorage.setItem(KEY,JSON.stringify({students,records}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tab(id){['students','register','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));render()}
function options(id){
let s=document.getElementById(id),old=s.value;
s.innerHTML='<option value="">Seleccionar estudiante</option>'+students.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' · '+esc(x.course)+'</option>').join('');
if(students.some(x=>x.id===old))s.value=old;
}
function render(){
let list=document.getElementById('studentsList');
list.innerHTML=students.length?students.map(s=>'<div class="entry"><strong>'+esc(s.name)+'</strong><p>'+esc(s.course)+'</p><small>Registros: '+records.filter(r=>r.sid===s.id).length+'</small></div>').join(''):'<p>Aún no hay estudiantes. Crea uno ficticio para probar.</p>';
options('who');options('hw');history();
}
function history(){
let id=document.getElementById('hw').value;
let found=records.filter(r=>r.sid===id).sort((a,b)=>b.saved.localeCompare(a.saved));
document.getElementById('records').innerHTML=!id?'<p>Selecciona un estudiante.</p>':found.length?found.map(r=>'<div class="entry"><strong>'+esc(r.sign)+'</strong><p>'+esc(r.result)+'</p><p>Fecha de actividad: '+esc(r.date)+'</p><p>Guardado: '+new Date(r.saved).toLocaleString('es-CL')+'</p><p>'+esc(r.obs)+'</p></div>').join(''):'<p>Sin registros.</p>';
}
document.getElementById('sf').addEventListener('submit',e=>{
e.preventDefault();
students.push({id:'EST-'+Date.now(),name:document.getElementById('name').value.trim(),course:document.getElementById('course').value.trim()});
save();e.target.reset();render();alert('Perfil creado.');
});
document.getElementById('rf').addEventListener('submit',e=>{
e.preventDefault();
let sid=document.getElementById('who').value;
if(!students.some(s=>s.id===sid)){alert('Selecciona un estudiante.');return}
records.push({sid,sign:document.getElementById('sign').value.trim(),result:document.getElementById('result').value,date:document.getElementById('date').value,obs:document.getElementById('obs').value.trim(),saved:new Date().toISOString()});
save();e.target.reset();document.getElementById('date').value=today();render();tab('history');document.getElementById('hw').value=sid;history();alert('Aprendizaje guardado.');
});
document.getElementById('hw').addEventListener('change',history);
function backup(){
let b=new Blob([JSON.stringify({app:'LSCh A1',students,records},null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-lsch-a1.json';a.click();URL.revokeObjectURL(a.href);
}
load();document.getElementById('date').value=today();render();
</script>
</body>
</html>
